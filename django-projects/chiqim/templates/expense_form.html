<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xarajat qo'shish — Chiqim</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scrim" data-scrim></div>

<div class="app">

  <aside class="sidebar" data-sidebar>
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <div class="brand-name">Chiqim</div>
      </div>
    </div>

    <nav class="nav-group">
      <div class="nav-label">Asosiy</div>
      <a class="nav-link" href="dashboard.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13h6V4H4v9Zm10 7h6V4h-6v16ZM4 20h6v-4H4v4Z"/></svg>
        Bosh sahifa
      </a>
      <a class="nav-link active" href="expenses.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Xarajatlar
      </a>
      <a class="nav-link" href="categories.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
        Kategoriyalar
      </a>
    </nav>

    <nav class="nav-group">
      <div class="nav-label">Hisob</div>
      <a class="nav-link" href="profile.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-3.8 4-5.6 7-5.6s5.8 1.8 7 5.6"/></svg>
        Profil
      </a>
    </nav>

    <div class="sidebar-foot">
      <a class="nav-link" href="login.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 17l5-5-5-5M20 12H9M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6"/></svg>
        Chiqish
      </a>
    </div>
  </aside>

  <div>
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-btn" data-sidebar-open aria-label="Menyu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="topbar-title">Xarajat qo'shish</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" data-theme-toggle aria-label="Mavzuni almashtirish">
          <span data-theme-icon>☾</span>
        </button>
        <div class="profile-menu">
          <button class="profile-trigger" data-profile-trigger>
            <span class="avatar">AK</span>
            <span class="profile-trigger-name">Aziz Karimov</span>
          </button>
          <div class="dropdown" data-profile-menu>
            <a class="dropdown-link" href="profile.html">Profil</a>
            <a class="dropdown-link" href="categories.html">Kategoriyalar</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-link" href="login.html">Chiqish</a>
          </div>
        </div>
      </div>
    </header>

    <main class="content content-narrow">

      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Yangi xarajat</h2>
            <p class="panel-desc">Ma'lumotlarni to'ldiring — o'zgartirish uchun ham shu forma ishlatiladi</p>
          </div>
        </div>

        <!-- Django'da: {% csrf_token %} shu yerga qo'shiladi -->
        <form method="post" action="#">

          <div class="field">
            <label for="amount">Summa</label>
            <div class="input-amount-wrap">
              <input class="input" type="number" id="amount" name="amount" placeholder="0" min="0" step="100" required>
              <span class="suffix">so'm</span>
            </div>
          </div>

          <div class="field">
            <label for="category">Kategoriya</label>
            <select class="input" id="category" name="category" required>
              <option value="">Tanlang...</option>
              <option value="food">Oziq-ovqat</option>
              <option value="transport">Transport</option>
              <option value="utilities">Kommunal</option>
              <option value="fun" selected>O'yin-kulgi</option>
              <option value="other">Boshqa</option>
            </select>
          </div>

          <div class="field">
            <label for="date">Sana</label>
            <input class="input" type="date" id="date" name="date" value="2026-09-24" required>
          </div>

          <div class="field">
            <label for="description">Tavsif</label>
            <textarea class="input" id="description" name="description" placeholder="Masalan: kinoteatr, do'stlar bilan">Kinoteatr — do'stlar bilan</textarea>
            <p class="hint">Ixtiyoriy — kelajakda qidirish uchun qulay bo'ladi</p>
          </div>

          <div class="field">
            <label>To'lov usuli</label>
            <div class="radio-cards">
              <label class="radio-card">
                <input type="radio" name="payment_method" value="cash" checked>
                <span>Naqd</span>
              </label>
              <label class="radio-card">
                <input type="radio" name="payment_method" value="card">
                <span>Karta</span>
              </label>
              <label class="radio-card">
                <input type="radio" name="payment_method" value="transfer">
                <span>O'tkazma</span>
              </label>
            </div>
          </div>

          <div class="field" style="display:flex; gap:10px; margin-top:26px;">
            <button type="submit" class="btn btn-primary">Saqlash</button>
            <a href="expenses.html" class="btn btn-ghost">Bekor qilish</a>
            <button type="button" class="btn btn-danger" style="margin-left:auto;">O'chirish</button>
          </div>

        </form>
      </div>

    </main>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
