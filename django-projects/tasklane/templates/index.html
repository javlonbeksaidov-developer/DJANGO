{% extends 'base.html' %}
{% block content %}
{% load static %}

<main class="container page">
  <div class="page-head">
    <div>
      <h1>My tasks</h1>
      <p>3 open, 1 done</p>
    </div>
    <a class="btn" href="{% url 'main:manage' %}">Add task</a>
  </div>

  <!-- Filters: a plain GET form. The server reads ?q=&status=&priority= -->
  <form class="card filter-form" action="{% url 'main:index' %}" method="get">
    <div class="field field--search">
      <label for="q">Search</label>
      <input class="input" id="q" name="q" type="search" placeholder="Search by title">
    </div>
    <div class="field">
      <label for="status">Status</label>
      <select class="select" id="status" name="status">
        <option value="any">Any</option>
        <option value="open">Open</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="field">
      <label for="priority">Priority</label>
      <select class="select" id="priority" name="priority">
        <option value="any">Any</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn" type="submit" name="filter">Apply</button>
      <a class="btn btn--ghost" href="{% url 'main:index' %}">Reset</a>
    </div>
  </form>

  <ul class="task-list">
    {% for task in tasks %}

    <li class="task {% if task.status %} task--done {% endif %}">
      <form action="{% url 'main:tasks_toggle' task.id %}" method="post">
        {% csrf_token %}
        <button class="check {% if task.status %} check--on {% endif %}" type="submit" aria-label="Mark “Back up database” as open"></button>
      </form>
      <div class="task__body">
        <h2 class="task__title">{{ task.title }}</h2>
        <div class="task__meta">
          <span class="badge badge--{{ task.priority }}">{{ task.priority }}</span>
          <span>{{ task.due_date|date:'Y-m-d' }}</span>
        </div>
      </div>
    </li>

    {% endfor %}

  </ul>

</main>

{% endblock content %}
