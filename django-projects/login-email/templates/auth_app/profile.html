{% extends 'base.html' %}
{% block content %}

<style>
    .profile-card {
        width: 320px;
        padding: 35px 25px;
        background: white;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .profile-image {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #e5e7eb;
        margin-bottom: 20px;
    }

    .username {
        font-size: 24px;
        color: #111827;
        margin-bottom: 10px;
    }

    .email {
        font-size: 15px;
        color: #6b7280;
    }
</style>

<div class="profile-card">
    <img class="profile-image" src="https://i.pravatar.cc/300" alt="Profile rasmi">

    <h2 class="username">{{ user.username }}</h2>
    <p class="email">{{ user.email }}</p>
</div>


{% endblock content %}
