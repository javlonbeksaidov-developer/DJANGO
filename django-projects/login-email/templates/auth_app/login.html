<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(-45deg,
                    #050816,
                    #101b3d,
                    #123c56,
                    #201044,
                    #050816);
            background-size: 400% 400%;
            animation: liveBackground 12s ease infinite;
        }

        @keyframes liveBackground {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Orqa fondagi yorug'lik */
        body::before {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: #00eeff;
            filter: blur(150px);
            opacity: 0.2;
            top: 5%;
            left: 10%;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: #8b5cf6;
            filter: blur(150px);
            opacity: 0.25;
            bottom: 5%;
            right: 10%;
            pointer-events: none;
        }

        .container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            isolation: isolate;
        }

        /* Aylanuvchi neon chiziqlar */
        .container span {
            position: absolute;
            left: 0;
            width: 32px;
            height: 6px;
            background: #263b5a;
            border-radius: 80px;
            transform-origin: 200px;
            transform: rotate(calc(var(--i) * (360deg / 50)));
            animation: blink 3s linear infinite;
            animation-delay: calc(var(--i) * (3s / 50));
        }

        @keyframes blink {

            0%,
            100% {
                background: #263b5a;
                box-shadow: none;
            }

            25% {
                background: #00eeff;
                box-shadow: 0 0 12px #00eeff;
            }
        }

        .login-box {
            position: absolute;
            width: 320px;
            padding: 25px;
            z-index: 1;
            border-radius: 24px;
            background: rgba(12, 20, 42, 0.88);
            border: 1px solid rgba(0, 238, 255, 0.18);
            box-shadow: 0 0 40px rgba(0, 238, 255, 0.08);
            backdrop-filter: blur(15px);
        }

        h2 {
            font-size: 30px;
            color: #00eeff;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(0, 238, 255, 0.4);
        }

        .input-box {
            position: relative;
            margin: 22px 0;
        }

        .input-box input {
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #263b5a;
            outline: none;
            border-radius: 40px;
            font-size: 15px;
            color: #fff;
            padding: 0 18px;
            transition: 0.3s ease;
        }

        .input-box input:focus {
            border-color: #00eeff;
            box-shadow: 0 0 12px rgba(0, 238, 255, 0.15);
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            font-size: 14px;
            color: #a8b6cc;
            pointer-events: none;
            transition: 0.3s ease;
        }

        .input-box input:focus~label,
        .input-box input:valid~label {
            top: 0;
            left: 15px;
            font-size: 11px;
            padding: 2px 7px;
            background: #101a32;
            color: #00eeff;
        }

        .forgot-pass {
            margin: 5px 0 20px;
            text-align: right;
        }

        .forgot-pass a {
            font-size: 12px;
            color: #b4c4da;
            text-decoration: none;
        }

        .forgot-pass a:hover,
        .signup-link a:hover {
            color: #fff;
        }

        .btn {
            width: 100%;
            height: 46px;
            background: #00eeff;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 15px;
            color: #071322;
            font-weight: 700;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #fff;
            box-shadow: 0 0 25px rgba(0, 238, 255, 0.5);
            transform: translateY(-2px);
        }

        .signup-link {
            margin-top: 22px;
            text-align: center;
            color: #b4c4da;
            font-size: 13px;
        }

        .signup-link a {
            color: #00eeff;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        @media (max-width: 480px) {
            .container {
                transform: scale(0.82);
            }
        }

        @media (max-width: 350px) {
            .container {
                transform: scale(0.72);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            body,
            .container span {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">
            <h2>Login</h2>

            <form action="#" method="post">
                {%  csrf_token  %}
                <div class="input-box">
                    <input type="text" name="username" required>
                    <label>Username</label>
                </div>

                <div class="input-box">
                    <input type="password" name="password" autocomplete="current-password" required>
                    <label>Password</label>
                </div>

                <div class="forgot-pass">
                    <a href="#">Forgot your password?</a>
                </div>

                <button class="btn" type="submit">
                    Login
                </button>

                <div class="signup-link">
                    Don't have an account?
                    <a href="{% url 'auth_app:register' %}">Sign Up</a>
                </div>
            </form>
        </div>

    </div>

</body>

</html>
